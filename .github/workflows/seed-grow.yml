name: seed-grow

# Grow the private 128 MiB E5 Data fixture (APFS container, volume UUID
# 30ADC749-...) to a 4 GiB raw image on this macOS runner, preserving the
# volume UUID and content, and publish the gzip to the private relay repo's
# seed-grown branch. The Apple-derived bytes only ever exist on the runner
# disk, in the private relay repo, and in this repo's short-lived run logs;
# nothing lands in this public repository.

on:
  workflow_dispatch:
    inputs:
      gib:
        description: "Target size in GiB (default 4)"
        default: "4"
      from_ref:
        description: "Relay branch/ref holding seed-128m.gz"
        default: "seed-input"

permissions:
  contents: read

jobs:
  grow:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Fetch the pristine fixture from the private relay
        env:
          GH_TOKEN: ${{ secrets.E5_RELAY_TOKEN }}
          FROM_REF: ${{ github.event.inputs.from_ref }}
        run: |
          set -euo pipefail
          mkdir out && cd out
          curl -fsSL -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/Enceka/unixnu-build/contents/seed-128m.gz?ref=$FROM_REF" \
            -H "Accept: application/vnd.github.raw" -o seed-128m.gz
          gunzip -k seed-128m.gz
          test "$(stat -f%z seed-128m)" = "134217728"

      - name: Grow the APFS container to fill the raw image
        env:
          GIB: ${{ github.event.inputs.gib }}
        run: |
          set -euxo pipefail
          cd out
          python3 -c "import os,sys; gib=int(sys.argv[1]); f=open('seed-grow.raw','wb'); f.truncate(gib<<30); f.seek(0); f.write(open('seed-128m','rb').read()); f.close(); print('raw bytes', os.path.getsize('seed-grow.raw'))" "$GIB"
          hdiutil attach -imagekey diskimage-class=CRawDiskImage -nomount -nobrowse seed-grow.raw >attach.log 2>&1
          echo "--- attach.log:"; cat attach.log
          store=$(grep '41504653-0000-11AA' attach.log | awk '{print $1}' | tail -1)
          test -n "$store" || { echo "no APFS partition in attach output"; exit 1; }
          echo "APFS partition=$store"
          diskutil apfs list -plist >listing.plist
          store_name=$(basename "$store")
          container=$(python3 -c "import plistlib,sys; ls=plistlib.load(open(sys.argv[1],'rb')); print(next(c['ContainerReference'] for c in ls['Containers'] if any(s['DeviceIdentifier']==sys.argv[2] for s in c.get('PhysicalStores',[]))))" listing.plist "$store_name") || { echo "--- apfs list:"; plutil -p listing.plist | head -80; exit 1; }
          echo "container=$container"
          diskutil apfs resizeContainer "$container" 0
          hdiutil detach "$store" -force || true
          python3 -c "import sys; gib=int(sys.argv[1]); h=open('seed-grow.raw','rb').read(4096); assert h[32:36]==b'NXSB','not NXSB after grow'; blocks=int.from_bytes(h[40:48],'little'); assert blocks*4096==gib<<30, f'container blocks {blocks} != {gib} GiB'; print('grown container blocks', blocks)" "$GIB"

      - name: Publish the grown seed to the private relay
        env:
          GH_TOKEN: ${{ secrets.E5_RELAY_TOKEN }}
          GIB: ${{ github.event.inputs.gib }}
        run: |
          set -euo pipefail
          cd out && gzip -1 -c seed-grow.raw > seed-grown.gz && cd ..
          ls -la out/seed-grown.gz
          rm -rf relay
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/Enceka/unixnu-build.git" relay
          cd relay
          git config user.name "seed-grow"
          git config user.email "seed-grow@users.noreply.github.com"
          git switch --orphan seed-grown
          cp ../out/seed-grown.gz .
          printf '{\n  "grown_from": "seed-128m.gz @ %s",\n  "gib": "%s",\n  "sha256_gz": "%s"\n}\n' \
            "${{ github.event.inputs.from_ref }}" "$GIB" \
            "$(shasum -a 256 ../out/seed-grown.gz | cut -d' ' -f1)" > seed-meta.json
          git add .
          git commit -qm "grown ${GIB}GiB Data seed from builder run $GITHUB_RUN_ID"
          git push -f origin seed-grown
